[project]
name = "snowtracks"
version = "0.0.1"
description = "Yet another minimalistic task tracker, written in Python."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.26.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "recommended"
